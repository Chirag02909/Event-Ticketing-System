spring.application.name=Event-ticketing

# ?????????????????????????????????????????????????????
# Database
# ?????????????????????????????????????????????????????
spring.datasource.url=${url}
spring.datasource.username=${uname}
spring.datasource.password=${upass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?????????????????????????????????????????????????????
# JPA / Hibernate
# ?????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?????????????????????????????????????????????????????
# JWT
# ?????????????????????????????????????????????????????
jwt.secret=${jwt_secret}
jwt.expiration-ms=86400000

# ?????????????????????????????????????????????????????
# Email (SMTP)
# ?????????????????????????????????????????????????????
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${gname}
spring.mail.password=${gpass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ?????????????????????????????????????????????????????
# Google OAuth2
# ?????????????????????????????????????????????????????
spring.security.oauth2.client.registration.google.client-id=${gcpid}
spring.security.oauth2.client.registration.google.client-secret=${gcpsecret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ?????????????????????????????????????????????????????
# Razorpay (Chunk 5)
# ?????????????????????????????????????????????????????
razorpay.key.id=${razorpay_key}
razorpay.key.secret=${razorpay_secret}
razorpay.webhook.secret=${webhook_secret}

# ?????????????????????????????????????????????????????
# Seat hold duration (minutes) ? used in ReservationServiceImpl
# ?????????????????????????????????????????????????????
ticketing.seat.hold.minutes=10

# ?????????????????????????????????????????????????????
# Async thread pool (Chunk 7 ? @Async email)
# ?????????????????????????????????????????????????????
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

logging.level.org.springframework.security=TRACE


# Minutes a waitlist offer remains valid before it cascades to the next
# person in line. Mirrors ticketing.seat.hold.minutes from Chunk 4.
ticketing.waitlist.offer.minutes=30

# Rolling window (in hours) used to compute booking-velocity trending scores.
# velocityScore = (CONFIRMED bookings in this window) / windowHours
ticketing.trending.window-hours=24
